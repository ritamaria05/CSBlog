name: Deploy to Github Pages
on:
  push:
    branches:
      [master]
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build and upload Astro
        uses: withastro/action@v3
